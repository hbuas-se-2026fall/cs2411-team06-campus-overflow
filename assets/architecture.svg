<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 880" width="1200" height="880" role="img" aria-labelledby="title desc">
  <title id="title">CampusOverflow AI 系统架构</title>
  <desc id="desc">三端接入、Agent 编排与子 Agent 池、FastAPI 业务边界、MySQL 与知识层。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f766e"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1200" height="880" rx="28" fill="#f8fafc"/>
  <rect x="1" y="1" width="1198" height="878" rx="27" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <text x="56" y="62" font-size="28" font-weight="700" fill="#0f172a" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">CampusOverflow AI 系统架构</text>
  <text x="56" y="90" font-size="14" fill="#64748b" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">AI 只建议，不处置 · 业务事实只由 FastAPI 与 MySQL 决定 · 高风险动作人工确认后执行</text>

  <!-- 层标签 -->
  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="12" font-weight="600">
    <rect x="36" y="158" width="88" height="28" rx="14" fill="#0f172a"/>
    <text x="80" y="177" fill="#ffffff" text-anchor="middle">接入层</text>
    <rect x="36" y="366" width="88" height="28" rx="14" fill="#b45309"/>
    <text x="80" y="385" fill="#ffffff" text-anchor="middle">AI 编排层</text>
    <rect x="36" y="576" width="88" height="28" rx="14" fill="#0f766e"/>
    <text x="80" y="595" fill="#ffffff" text-anchor="middle">业务层</text>
    <rect x="36" y="728" width="88" height="28" rx="14" fill="#334155"/>
    <text x="80" y="747" fill="#ffffff" text-anchor="middle">数据层</text>
  </g>

  <!-- 接入层 -->
  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="150" y="120" width="650" height="105" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="150" y="120" width="6" height="105" rx="3" fill="#0f766e"/>
    <text x="176" y="150" font-size="18" font-weight="700" fill="#0f172a">Next.js 16 · App Router</text>
    <text x="176" y="174" font-size="13" fill="#475569">学生端 / 教师端 / 管理端 · BFF 转发 · SSE 透传 · 文件导出</text>
    <g font-size="12" fill="#334155">
      <rect x="176" y="188" width="92" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="222" y="204" text-anchor="middle">学生端</text>
      <rect x="276" y="188" width="92" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="322" y="204" text-anchor="middle">教师端</text>
      <rect x="376" y="188" width="92" height="24" rx="12" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="422" y="204" text-anchor="middle">管理端</text>
    </g>
    <text x="640" y="204" font-size="12" fill="#64748b">不写核心业务规则</text>
  </g>

  <!-- AI 编排层 -->
  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="280" y="255" width="520" height="250" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="280" y="255" width="6" height="250" rx="3" fill="#b45309"/>
    <text x="306" y="286" font-size="18" font-weight="700" fill="#0f172a">Agent · Hono / Nitro</text>
    <text x="306" y="308" font-size="12.5" fill="#475569">主 Agent 编排 · 共享记忆唯一写入方</text>

    <rect x="306" y="322" width="468" height="64" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <text x="322" y="346" font-size="14" font-weight="700" fill="#92400e">子 Agent 池 · 8 槽（3 治理 + 5 问答）</text>
    <text x="322" y="368" font-size="12" fill="#92400e">问答优先 · 支援槽让位后从检查点续接</text>

    <g font-size="12" fill="#334155">
      <rect x="306" y="400" width="100" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="356" y="417" text-anchor="middle">工具网关</text>
      <rect x="416" y="400" width="108" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="470" y="417" text-anchor="middle">策略 / 审批</text>
      <rect x="534" y="400" width="108" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="588" y="417" text-anchor="middle">观测 / 审计</text>
      <rect x="652" y="400" width="92" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="698" y="417" text-anchor="middle">沙箱</text>
    </g>
    <text x="306" y="456" font-size="11.5" fill="#64748b">同进程逻辑隔离 · 任务间不共享上下文与凭证 · 外部命令 / 浏览器 / MCP / 文件执行走沙箱</text>
    <text x="306" y="478" font-size="11.5" fill="#64748b">工具白名单 ∩ 角色权限 ∩ 数据范围；模型参数不能扩权</text>
  </g>

  <!-- MCP -->
  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="840" y="255" width="300" height="90" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="840" y="255" width="5" height="90" rx="2.5" fill="#64748b"/>
    <text x="862" y="282" font-size="15" font-weight="700" fill="#0f172a">MCP 适配器</text>
    <text x="862" y="304" font-size="12" fill="#475569">只读 · 白名单 · 限流</text>
    <text x="862" y="324" font-size="11.5" fill="#64748b">主 / 备 token 轮换与过期</text>
  </g>

  <!-- Workflow -->
  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="840" y="365" width="300" height="140" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="840" y="365" width="5" height="140" rx="2.5" fill="#0f766e"/>
    <text x="862" y="392" font-size="15" font-weight="700" fill="#0f172a">Workflow 运行状态</text>
    <text x="862" y="414" font-size="12" fill="#475569">队列 · 恢复 · 执行回执</text>
    <text x="862" y="436" font-size="12" fill="#475569">独立 PostgreSQL</text>
    <text x="862" y="458" font-size="11.5" fill="#64748b">不替代业务真值，不存私人会话</text>
  </g>

  <!-- 业务层 -->
  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="280" y="535" width="520" height="110" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="280" y="535" width="6" height="110" rx="3" fill="#0f766e"/>
    <text x="306" y="566" font-size="18" font-weight="700" fill="#0f172a">FastAPI · 轻量模块化单体</text>
    <text x="306" y="590" font-size="13" fill="#475569">身份与 RBAC · 课程 · 问答 · 审批 · 审计 · 事务</text>
    <text x="306" y="614" font-size="12.5" fill="#0f766e">/internal/agent/* · 服务凭证 + x-trace-id</text>
    <text x="700" y="566" font-size="12" fill="#64748b">6 个业务模块</text>
  </g>

  <!-- 数据层 -->
  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <rect x="150" y="675" width="330" height="130" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="150" y="675" width="6" height="130" rx="3" fill="#334155"/>
    <text x="176" y="706" font-size="17" font-weight="700" fill="#0f172a">MySQL</text>
    <text x="176" y="730" font-size="13" fill="#475569">业务真值与最终授权</text>
    <text x="176" y="752" font-size="12" fill="#64748b">用户 / 课程 / 问答 / 审批 / 审计</text>
    <text x="176" y="774" font-size="12" fill="#0f766e">只有 FastAPI 能写</text>

    <rect x="510" y="675" width="300" height="130" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="510" y="675" width="6" height="130" rx="3" fill="#334155"/>
    <text x="536" y="706" font-size="17" font-weight="700" fill="#0f172a">Markdown / Wiki</text>
    <text x="536" y="730" font-size="13" fill="#475569">知识参考，不承担授权</text>
    <text x="536" y="752" font-size="12" fill="#64748b">卡片摘要 + 正文 → RAG</text>
    <text x="536" y="774" font-size="12" fill="#64748b">HNSW + BM25 + RRF</text>

    <rect x="840" y="675" width="300" height="130" rx="16" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="840" y="675" width="6" height="130" rx="3" fill="#334155"/>
    <text x="866" y="706" font-size="17" font-weight="700" fill="#0f172a">审计与观测</text>
    <text x="866" y="730" font-size="13" fill="#475569">run / tool call / approval</text>
    <text x="866" y="752" font-size="12" fill="#64748b">trace id + agent_run_id</text>
    <text x="866" y="774" font-size="12" fill="#64748b">脱敏摘要，不含密钥原文</text>
  </g>

  <!-- 连线 -->
  <g fill="none" stroke="#64748b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="540" y1="225" x2="540" y2="251" marker-end="url(#arrow)"/>
    <path d="M 200 225 L 200 590 L 276 590" marker-end="url(#arrow-teal)"/>
    <line x1="540" y1="505" x2="540" y2="531" marker-end="url(#arrow-teal)"/>
    <line x1="800" y1="300" x2="836" y2="300" marker-end="url(#arrow)"/>
    <line x1="800" y1="430" x2="836" y2="430" marker-end="url(#arrow)"/>
    <line x1="380" y1="645" x2="380" y2="671" marker-end="url(#arrow)"/>
    <path d="M 810 740 L 824 740 L 824 492 L 804 492" stroke-dasharray="6 5" marker-end="url(#arrow-amber)"/>
  </g>

  <g font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="11.5" fill="#64748b">
    <text x="548" y="244">SSE</text>
    <text x="152" y="420" fill="#0f766e">业务请求 · BFF</text>
    <text x="548" y="522" fill="#0f766e">内部白名单接口</text>
    <text x="806" y="292">工具调用</text>
    <text x="806" y="422">状态写入</text>
    <text x="388" y="666">SQL / 事务</text>
    <text x="690" y="498" fill="#b45309">RAG 检索</text>
  </g>

  <text x="600" y="848" text-anchor="middle" font-size="12" fill="#94a3b8" font-family="'Inter','Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">默认关闭，失败隔离 · 先有证据，再谈效果</text>
</svg>
