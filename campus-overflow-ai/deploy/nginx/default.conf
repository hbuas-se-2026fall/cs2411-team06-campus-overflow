# 生产入口反向代理：由 http 上下文 include（镜像内 /etc/nginx/conf.d/*.conf 默认挂载点）。
# 目标：入口层限制每 IP 连接数与请求速率，避免后端在突发并发下被直接打穿。

upstream backend {
    server backend:8000;
    keepalive 32;
}

limit_conn_zone $binary_remote_addr zone=api_conn:10m;
limit_req_zone $binary_remote_addr zone=api_req:10m rate=1000r/s;

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # limit_req/limit_conn 默认返回 503，这里统一为 429，再由 error_page 输出 JSON。
    limit_req_status 429;
    limit_conn_status 429;

    error_page 429 = @json_429;
    error_page 503 = @json_503;

    location /api/ {
        limit_conn api_conn 1000;
        limit_req zone=api_req burst=2000 nodelay;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://backend;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # 健康检查不参与限流，供负载均衡与容器健康检查使用。
    location = /health {
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_pass http://backend/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
        proxy_send_timeout 10s;
    }

    # 内部 Agent 白名单接口只允许服务间直连，入口一律拒绝且不转发。
    location /internal/ {
        deny all;
    }

    # 前端尚未接入，先占位返回 JSON 404。
    location / {
        default_type "application/json; charset=utf-8";
        return 404 '{"code":404,"data":null,"message":"服务暂未开放，请稍后重试"}';
    }

    location @json_429 {
        default_type "application/json; charset=utf-8";
        return 429 '{"code":429,"data":null,"message":"请求过于频繁，请稍后重试"}';
    }

    location @json_503 {
        default_type "application/json; charset=utf-8";
        return 503 '{"code":503,"data":null,"message":"请求过于频繁，请稍后重试"}';
    }
}
