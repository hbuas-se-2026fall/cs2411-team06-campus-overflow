# 一期生产形态：业务后端 + MySQL。前端/Agent/nginx 属二阶段，Redis 为可选增强不纳入。
# 用法：在 campus-overflow-ai/ 下执行
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# 敏感项均支持环境变量覆盖；真实部署必须覆盖默认密码与 JWT 密钥。
name: campus-overflow

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: campus_overflow
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    environment:
      BACKEND_DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/campus_overflow?charset=utf8mb4
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:?BACKEND_JWT_SECRET is required}
      BACKEND_DEBUG: "false"
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:3000}
      # 单 worker 连接池；多 worker 总量 = workers × (size + overflow)（ADR-012）
      BACKEND_DB_POOL_SIZE: ${BACKEND_DB_POOL_SIZE:-10}
      BACKEND_DB_POOL_MAX_OVERFLOW: ${BACKEND_DB_POOL_MAX_OVERFLOW:-10}
      BACKEND_DB_POOL_TIMEOUT: ${BACKEND_DB_POOL_TIMEOUT:-5}
      # 留空时由入口按 CPU/内存/连接预算计算，也可显式覆盖
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-}
      DB_CONNECTION_BUDGET: ${DB_CONNECTION_BUDGET:-100}
      WORKER_MAX: ${WORKER_MAX:-0}
    ports:
      # 仅绑定本机回环，公网只允许经 Nginx 进入（DEPLOY-003 边界收口）
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      # 唯一公网入口；后端只绑定 127.0.0.1 供本机排障
      - "${NGINX_PORT:-8080}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql-data:
