# 三服务生产形态：nginx + frontend + agent + backend + MySQL。
# Redis 仍为可选增强，不纳入当前 Compose。
# 用法：在 campus-overflow-ai/ 下执行
#   docker compose -f deploy/docker-compose.prod.yml up -d --build
# 敏感项均支持环境变量覆盖；真实部署必须覆盖默认密码与 JWT 密钥。
name: campus-overflow

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}
      MYSQL_DATABASE: campus_overflow
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p\"$${MYSQL_ROOT_PASSWORD}\""]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/backend.Dockerfile
    environment:
      BACKEND_DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in deploy/.env}@mysql:3306/campus_overflow?charset=utf8mb4
      BACKEND_JWT_SECRET: ${BACKEND_JWT_SECRET:?set BACKEND_JWT_SECRET in deploy/.env}
      BACKEND_AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?set AGENT_SERVICE_TOKEN in deploy/.env}
      BACKEND_DEBUG: "false"
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost}
      BACKEND_RUN_CONTROL_ENABLED: ${RUN_CONTROL_ENABLED:-false}
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request;urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  agent:
    build:
      context: ../agent
      dockerfile: ../deploy/agent.Dockerfile
    environment:
      NODE_ENV: production
      AGENT_PORT: "8787"
      NITRO_PORT: "8787"
      BACKEND_BASE_URL: http://backend:8000
      AGENT_SERVICE_TOKEN: ${AGENT_SERVICE_TOKEN:?set AGENT_SERVICE_TOKEN in deploy/.env}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      AGENT_MODEL_ID: ${AGENT_MODEL_ID:-gpt-4o-mini}
      WEB_SEARCH_ENABLED: ${WEB_SEARCH_ENABLED:-false}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_BROWSER_ENABLED: ${WEB_BROWSER_ENABLED:-false}
      RAG_ENABLED: ${RAG_ENABLED:-false}
      KNOWLEDGE_ROOT: ${KNOWLEDGE_ROOT:-}
      RAG_EMBEDDING_BASE_URL: ${RAG_EMBEDDING_BASE_URL:-}
      RAG_EMBEDDING_API_KEY: ${RAG_EMBEDDING_API_KEY:-}
      RAG_EMBEDDING_MODEL: ${RAG_EMBEDDING_MODEL:-}
      RUN_CONTROL_ENABLED: ${RUN_CONTROL_ENABLED:-false}
      SKILL_INJECTION_ENABLED: ${SKILL_INJECTION_ENABLED:-false}
      MCP_UPSTREAM_SERVERS: ${MCP_UPSTREAM_SERVERS:-[]}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/agent/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deploy/frontend.Dockerfile
    environment:
      NODE_ENV: production
      BACKEND_ORIGIN: http://backend:8000
      AGENT_ORIGIN: http://agent:8787
    depends_on:
      backend:
        condition: service_healthy
      agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

volumes:
  mysql-data:
